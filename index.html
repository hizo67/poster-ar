<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>

<body style="margin:0; padding:0; overflow:hidden; width:100vw; height:100vh;">

  <a-scene
    style="position:fixed; top:0; left:0; width:100vw; height:100vh;"
    mindar-image="imageTargetSrc: ./targets/targets.mind; filterMinCF: 0.003; filterBeta: 300;"
    embedded
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
  >

    <a-assets>
      <video
        id="animation"
        src="./assets/animation.mp4"
        loop
        muted
        playsinline
        webkit-playsinline
      ></video>
    </a-assets>

    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>

    <a-entity
      id="posterTarget"
      mindar-image-target="targetIndex: 0">

      <a-video
        src="#animation"
        width="1"
        height="1.25"
        position="0 0 0.01">
      </a-video>

    </a-entity>

  </a-scene>

  <script>
    const video = document.querySelector("#animation");
    const target = document.querySelector("#posterTarget");

    target.addEventListener("targetFound", () => {
      video.play();
    });

    target.addEventListener("targetLost", () => {
      video.pause();
    });
  </script>

</body>
</html>
